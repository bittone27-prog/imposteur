<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imposteur</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
  .container { width: 100%; max-width: 480px; }
  h1 { text-align: center; color: #e94560; }
  .card { background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
  input { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: none; font-size: 16px; }
  select { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: none; font-size: 16px; }
  button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; background: #e94560; color: #fff; cursor: pointer; }
  button:hover { background: #c73650; }
  button.secondary { background: #0f3460; }
  button.voted { background: #f5a623; }
  button.voted:hover { background: #d4891a; }
  .hidden { display: none; }
  .code { font-size: 32px; letter-spacing: 6px; text-align: center; font-weight: bold; color: #f5a623; }
  .player { padding: 8px 12px; margin: 4px 0; background: #0f3460; border-radius: 8px; }
  .player.active { background: #e94560; }
  .word-box { text-align: center; font-size: 28px; font-weight: bold; padding: 20px; background: #0f3460; border-radius: 12px; margin: 10px 0; }
  .error { color: #ff6b6b; text-align: center; min-height: 20px; }
  .clue { padding: 6px 10px; margin: 3px 0; background: #0f3460; border-radius: 6px; }
  .vote-btn { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; background: #0f3460; color: #fff; cursor: pointer; }
  .vote-btn:hover { background: #1a4d7a; }
  .vote-btn.voted { background: #f5a623; }
  .vote-btn.voted:hover { background: #d4891a; }
  .timer { font-size: 24px; text-align: center; font-weight: bold; color: #f5a623; margin: 15px 0; }
  .timer.danger { color: #ff6b6b; }
</style>
</head>
<body>
<div class="container">
  <h1>🕵️ IMPOSTEUR</h1>
  <div class="error" id="error"></div>

  <!-- ACCUEIL -->
  <div id="home" class="card">
    <input id="name" placeholder="Ton pseudo" maxlength="15">
    <button onclick="createRoom()">Créer une partie privée</button>
    <input id="codeInput" placeholder="Code de la partie" maxlength="5" style="text-transform:uppercase">
    <button class="secondary" onclick="joinRoom()">Rejoindre avec un code</button>
  </div>

  <!-- LOBBY -->
  <div id="lobby" class="card hidden">
    <div>Code de la partie :</div>
    <div class="code" id="roomCode"></div>
    
    <h3>Catégorie :</h3>
    <select id="categorySelect" onchange="changeCategory()">
      <option value="sport">Sport</option>
      <option value="celebrite">Célébrité</option>
      <option value="film">Film</option>
      <option value="anime">Anime</option>
      <option value="musique">Musique</option>
      <option value="nature">Nature</option>
      <option value="nourriture">Nourriture</option>
      <option value="animaux">Animaux</option>
    </select>
    
    <h3>Joueurs :</h3>
    <div id="playersList"></div>
    <button id="startBtn" class="hidden" onclick="startGame()">Lancer la partie</button>
    <div id="waitMsg">En attente de l'hôte (3 joueurs minimum)...</div>
  </div>

  <!-- JEU -->
  <div id="game" class="card hidden">
    <div>Ton mot :</div>
    <div class="word-box" id="myWord"></div>
    <h3>Joueurs :</h3>
    <div id="gamePlayers"></div>
    <h3>Mots dits :</h3>
    <div id="clues"></div>
    <div id="turnArea">
      <input id="clueInput" placeholder="Dis un mot en rapport avec ton mot">
      <button onclick="sendClue()">Envoyer</button>
    </div>
  </div>

  <!-- VOTE -->
  <div id="vote" class="card hidden">
    <h2>À qui voter ?</h2>
    <div class="timer" id="voteTimer">15</div>
    <div id="voteList"></div>
  </div>

  <!-- RÉSULTAT -->
  <div id="result" class="card hidden">
    <h2 id="resultTitle"></h2>
    <div id="resultMessage"></div>
    <h3>Votes :</h3>
    <div id="resultVotes"></div>
    <button onclick="playAgain()">Rejouer</button>
    <button class="secondary" onclick="leaveRoom()">Quitter le groupe</button>
  </div>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
  const socket = io();
  let myId = null;
  let isHost = false;
  let voteTimer = null;
  let votedFor = null;

  function show(id) {
    ['home','lobby','game','vote','result'].forEach(x => document.getElementById(x).classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  function setError(msg) {
    document.getElementById('error').textContent = msg || '';
    if (msg) setTimeout(() => document.getElementById('error').textContent = '', 4000);
  }

  function getName() {
    const n = document.getElementById('name').value.trim();
    if (!n) { setError('Entre un pseudo !'); return null; }
    return n;
  }

  function createRoom() {
    const name = getName(); 
    if (!name) return;
    socket.emit('createRoom', { name });
  }

  function joinRoom() {
    const name = getName(); 
    if (!name) return;
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    if (!code) { setError('Entre un code !'); return; }
    socket.emit('joinRoom', { name, code });
  }

  function changeCategory() {
    const category = document.getElementById('categorySelect').value;
    socket.emit('setCategory', { category });
  }

  function startGame() { 
    socket.emit('startGame'); 
  }

  function sendClue() {
    const input = document.getElementById('clueInput');
    const clue = input.value.trim();
    if (!clue) return;
    socket.emit('sendClue', { clue });
    input.value = '';
  }

  function vote(playerId) {
    votedFor = playerId;
    socket.emit('vote', { votedId: playerId });
    updateVoteButtons();
  }

  function updateVoteButtons() {
    const buttons = document.querySelectorAll('.vote-btn');
    buttons.forEach(btn => {
      if (btn.dataset.playerId === votedFor) {
        btn.classList.add('voted');
      } else {
        btn.classList.remove('voted');
      }
    });
  }

  function startVoteTimer() {
    let timeLeft = 15;
    const timerEl = document.getElementById('voteTimer');
    
    updateTimerDisplay(timeLeft, timerEl);
    
    voteTimer = setInterval(() => {
      timeLeft--;
      updateTimerDisplay(timeLeft, timerEl);
      
      if (timeLeft <= 0) {
        clearInterval(voteTimer);
        voteTimer = null;
      }
    }, 1000);
  }

  function updateTimerDisplay(timeLeft, timerEl) {
    timerEl.textContent = timeLeft;
    if (timeLeft <= 5) {
      timerEl.classList.add('danger');
    } else {
      timerEl.classList.remove('danger');
    }
  }

  function playAgain() {
    socket.emit('again');
    votedFor = null;
  }

  function leaveRoom() {
    location.reload();
  }

  socket.on('message', (data) => {
    if (data.type === 'error') {
      setError(data.message);
    }
  });

  socket.on('roomUpdate', (data) => {
    show('lobby');
    document.getElementById('roomCode').textContent = data.code;
    document.getElementById('categorySelect').value = data.selectedCategory || 'sport';
    document.getElementById('playersList').innerHTML = 
      data.players.map(p => '<div class="player">' + p.name + '</div>').join('');
    
    isHost = data.host === socket.id;
    document.getElementById('startBtn').classList.toggle('hidden', !isHost || data.players.length < 3);
    document.getElementById('waitMsg').classList.toggle('hidden', isHost && data.players.length >= 3);
  });

  socket.on('gameUpdate', (data) => {
    if (data.phase === 'clues') {
      show('game');
      document.getElementById('myWord').textContent = data.word;
      document.getElementById('gamePlayers').innerHTML =
        data.players.map(p => '<div class="player ' + (p.id === data.turn ? 'active' : '') + '">' + p.name + (p.id === data.turn ? ' ← son tour' : '') + '</div>').join('');
      document.getElementById('clues').innerHTML =
        data.clues.map(c => '<div class="clue"><b>' + c.name + ' :</b> ' + c.clue + '</div>').join('');
      document.getElementById('turnArea').classList.toggle('hidden', data.turn !== socket.id);
    } else if (data.phase === 'voting') {
      votedFor = null;
      show('vote');
      document.getElementById('voteList').innerHTML = 
        data.players.map(p => '<button class="vote-btn" data-playerId="' + p.id + '" onclick="vote(\'' + p.id + '\')">' + p.name + '</button>').join('');
      startVoteTimer();
    }
  });

  socket.on('state', (data) => {
    if (data.phase === 'result') {
      if (voteTimer) clearInterval(voteTimer);
      show('result');
      const impostor = data.players.find(p => p.isImpostor);
      
      document.getElementById('resultTitle').textContent = 
        data.result.groupWins ? '✅ Les civils ont gagné !' : '❌ L\'imposteur a gagné !';
      
      document.getElementById('resultMessage').innerHTML = 
        '<p><b>Imposteur :</b> ' + impostor.name + '</p>' +
        '<p><b>Mot commun :</b> ' + data.players.find(p => !p.isImpostor).word + '</p>' +
        '<p><b>Mot imposteur :</b> ' + impostor.word + '</p>';
      
      document.getElementById('resultVotes').innerHTML = 
        '<p><b>Éliminé :</b> ' + (data.result.accusedName || 'Égalité !') + '</p>';
    }
  });

  show('home');
</script>
</body>
</html>

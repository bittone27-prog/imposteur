<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imposteur</title>
<style>
  body { font-family: Arial, sans-serif; background:#1a1a2e; color:#fff; margin:0; padding:20px; display:flex; justify-content:center; }
  .card { background:#16213e; padding:20px; border-radius:12px; width:100%; max-width:420px; }
  input, button { width:100%; padding:12px; margin:6px 0; border-radius:8px; border:none; font-size:16px; box-sizing:border-box; }
  button { background:#e94560; color:#fff; cursor:pointer; }
  button.secondary { background:#0f3460; }
  .hidden { display:none; }
  .code { font-size:32px; letter-spacing:6px; text-align:center; background:#0f3460; padding:10px; border-radius:8px; margin:10px 0; }
  .player { padding:6px 0; }
  .word-box { font-size:28px; text-align:center; background:#0f3460; padding:16px; border-radius:8px; margin:10px 0; }
  .clue { padding:4px 0; }
  #error { color:#ff6b6b; text-align:center; min-height:20px; }
</style>
</head>
<body>
<div class="card">
  <div id="error"></div>

  <div id="home">
    <input id="name" placeholder="Ton pseudo" maxlength="15">
    <button onclick="createRoom()">Créer une partie privée</button>
    <input id="codeInput" placeholder="Code de la partie" maxlength="5" style="text-transform:uppercase">
    <button class="secondary" onclick="joinRoom()">Rejoindre avec un code</button>
  </div>

  <div id="lobby" class="hidden">
    <div>Code de la partie :</div>
    <div class="code" id="roomCode"></div>
    <h3>Joueurs :</h3>
    <div id="playersList"></div>
    <button id="startBtn" class="hidden" onclick="startGame()">Lancer la partie</button>
    <div id="waitMsg">En attente de l'hôte (3 joueurs minimum)...</div>
  </div>

  <div id="game" class="hidden">
    <div>Ton mot :</div>
    <div class="word-box" id="myWord"></div>
    <h3>Joueurs :</h3>
    <div id="gamePlayers"></div>
    <h3>Mots dits :</h3>
    <div id="clues"></div>
    <div id="turnArea" class="hidden">
      <input id="clueInput" placeholder="Dis un mot en rapport avec ton mot">
      <button onclick="sendClue()">Envoyer</button>
    </div>
  </div>
</div>

<script>
var ws = null;
var myId = null;

function connect() {
  var proto = location.protocol === "https:" ? "wss://" : "ws://";
  ws = new WebSocket(proto + location.host);
  ws.onmessage = function (e) {
    var data = JSON.parse(e.data);
    if (data.type === "error") setError(data.message);
    if (data.type === "state") render(data);
  };
  ws.onclose = function () { setTimeout(connect, 1500); };
}

function send(obj) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
  else setError("Connexion en cours, réessaie dans 2 secondes...");
}

function show(id) {
  ["home", "lobby", "game"].forEach(function (x) {
    document.getElementById(x).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
}

function setError(msg) {
  var el = document.getElementById("error");
  el.textContent = msg || "";
  if (msg) setTimeout(function () { el.textContent = ""; }, 4000);
}

function getName() {
  var n = document.getElementById("name").value.trim();
  if (!n) { setError("Entre un pseudo !"); return null; }
  return n;
}

function createRoom() {
  var name = getName();
  if (!name) return;
  send({ type: "create", name: name });
}

function joinRoom() {
  var name = getName();
  if (!name) return;
  var code = document.getElementById("codeInput").value.trim().toUpperCase();
  if (!code) { setError("Entre un code !"); return; }
  send({ type: "join", name: name, code: code });
}

function startGame() { send({ type: "start" }); }

function sendClue() {
  var input = document.getElementById("clueInput");
  var clue = input.value.trim();
  if (!clue) return;
  send({ type: "clue", clue: clue });
  input.value = "";
}

function render(s) {
  myId = s.youId;
  if (s.phase === "lobby") {
    show("lobby");
    document.getElementById("roomCode").textContent = s.code;
    document.getElementById("playersList").innerHTML = s.players.map(function (p) {
      return '<div class="player">' + p.name + (p.id === s.hostId ? " 👑" : "") + "</div>";
    }).join("");
    var isHost = s.hostId === s.youId;
    document.getElementById("startBtn").classList.toggle("hidden", !isHost);
    document.getElementById("waitMsg").classList.toggle("hidden", isHost);
  } else {
    show("game");
    document.getElementById("myWord").textContent = s.word || "";
    document.getElementById("gamePlayers").innerHTML = s.players.map(function (p) {
      return '<div class="player">' + p.name + (p.id === s.turnId ? " ← son tour" : "") + "</div>";
    }).join("");
    document.getElementById("clues").innerHTML = (s.clues || []).map(function (c) {
      return '<div class="clue"><b>' + c.name + " :</b> " + c.clue + "</div>";
    }).join("");
    document.getElementById("turnArea").classList.toggle("hidden", s.turnId !== s.youId);
  }
}

connect();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imposteur</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
  .app { width: 100%; max-width: 480px; }
  h1 { text-align: center; }
  .card { background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
  input, select { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: none; font-size: 16px; }
  button { width: 100%; padding: 12px; margin: 6px 0; border: none; border-radius: 8px; background: #0f9d58; color: #fff; font-size: 16px; cursor: pointer; }
  button.secondary { background: #3a3f5c; }
  button.danger { background: #c0392b; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .vote-btn { background: #3a3f5c; }
  .vote-btn.voted { background: #f39c12; color: #000; font-weight: bold; }
  .lang { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
  .lang button { width: auto; padding: 6px 14px; background: #3a3f5c; }
  .lang button.active { background: #0f9d58; }
  .hidden { display: none; }
  .word { font-size: 28px; text-align: center; padding: 15px; background: #0f3460; border-radius: 10px; margin: 10px 0; }
  .clue { padding: 6px 0; border-bottom: 1px solid #2a3558; }
  .players li { padding: 4px 0; }
  .timer { text-align: center; font-size: 22px; color: #f39c12; margin: 8px 0; }
  .error { color: #ff6b6b; text-align: center; min-height: 20px; }
  .code { text-align: center; font-size: 32px; letter-spacing: 6px; font-weight: bold; color: #f39c12; }
</style>
</head>
<body>
<div class="app">
  <div class="lang">
    <button id="lang-fr" onclick="setLang('fr')">FR</button>
    <button id="lang-en" onclick="setLang('en')">EN</button>
    <button id="lang-he" onclick="setLang('he')">עב</button>
  </div>

  <h1>🕵️ <span data-t="title"></span></h1>
  <div class="error" id="error"></div>

  <!-- ACCUEIL -->
  <div id="home" class="card">
    <input id="name" maxlength="16" data-p="yourName">
    <button onclick="createRoom()" data-t="create"></button>
    <input id="codeInput" maxlength="4" data-p="code" style="text-transform:uppercase">
    <button class="secondary" onclick="joinRoom()" data-t="join"></button>
  </div>

  <!-- LOBBY -->
  <div id="lobby" class="card hidden">
    <div class="code" id="roomCode"></div>
    <p data-t="players"></p>
    <ul class="players" id="playersList"></ul>
    <div id="catBox">
      <p data-t="category"></p>
      <select id="category" onchange="setCategory()"></select>
    </div>
    <button id="startBtn" onclick="startGame()" data-t="start"></button>
    <p id="waitHost" class="hidden" data-t="waitHost"></p>
    <button class="danger" onclick="leave()" data-t="leave"></button>
  </div>

  <!-- INDICES -->
  <div id="clues" class="card hidden">
    <p><span data-t="yourWord"></span></p>
    <div class="word" id="myWord"></div>
    <p id="turnInfo"></p>
    <div id="clueBox">
      <input id="clueInput" maxlength="24" data-p="clue">
      <button onclick="sendClue()" data-t="send"></button>
    </div>
    <div id="cluesList"></div>
  </div>

  <!-- VOTE -->
  <div id="voting" class="card hidden">
    <p data-t="voteTitle"></p>
    <div class="timer" id="timer"></div>
    <div id="voteButtons"></div>
    <div id="cluesList2"></div>
  </div>

  <!-- FIN -->
  <div id="end" class="card hidden">
    <div id="result"></div>
    <button id="againBtn" onclick="again()" data-t="again"></button>
    <p id="waitHost2" class="hidden" data-t="waitHost"></p>
    <button class="danger" onclick="leave()" data-t="leave"></button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const T = {
  fr: {
    title: "Imposteur", create: "Créer une partie", join: "Rejoindre", yourName: "Ton prénom", code: "Code de la partie",
    players: "Joueurs :", category: "Catégorie :", start: "Lancer la partie", waitHost: "En attente de l'hôte...",
    leave: "Quitter le groupe", yourWord: "Ton mot :", send: "Envoyer", voteTitle: "Qui est l'imposteur ?",
    again: "Rejouer (rester dans le groupe)", yourTurn: "👉 C'est ton tour !", turnOf: "Tour de : ", round: "Tour",
    secs: "s", tie: "Égalité ! Personne n'est éliminé.", eliminated: "a été éliminé.", wasImp: "Était imposteur : ",
    yes: "✓ OUI", no: "✗ NON", impWas: "L'imposteur était : ", impWord: "Son mot : ", civWord: "Mot des innocents : ",
    needName: "Entre ton prénom", needCode: "Entre le code", clue: "Ton mot-indice",
    cats: { sport: "Sport", celebrite: "Célébrités", film: "Films", anime: "Anime", musique: "Musique", nature: "Nature", nourriture: "Nourriture", animaux: "Animaux" }
  },
  en: {
    title: "Impostor", create: "Create a game", join: "Join", yourName: "Your name", code: "Game code",
    players: "Players:", category: "Category:", start: "Start game", waitHost: "Waiting for the host...",
    leave: "Leave group", yourWord: "Your word:", send: "Send", voteTitle: "Who is the impostor?",
    again: "Play again (stay in group)", yourTurn: "👉 It's your turn!", turnOf: "Turn of: ", round: "Round",
    secs: "s", tie: "Tie! Nobody is eliminated.", eliminated: "was eliminated.", wasImp: "Was impostor: ",
    yes: "✓ YES", no: "✗ NO", impWas: "The impostor was: ", impWord: "Their word: ", civWord: "Innocents' word: ",
    needName: "Enter your name", needCode: "Enter the code", clue: "Your clue word",
    cats: { sport: "Sports", celebrite: "Celebrities", film: "Movies", anime: "Anime", musique: "Music", nature: "Nature", nourriture: "Food", animaux: "Animals" }
  },
  he: {
    title: "מתחזה", create: "צור משחק", join: "הצטרף", yourName: "השם שלך", code: "קוד משחק",
    players: "שחקנים:", category: "קטגוריה:", start: "התחל משחק", waitHost: "ממתין למארח...",
    leave: "עזוב קבוצה", yourWord: "המילה שלך:", send: "שלח", voteTitle: "מי המתחזה?",
    again: "שחק שוב (הישאר בקבוצה)", yourTurn: "👉 התור שלך!", turnOf: "התור של: ", round: "סיבוב",
    secs: "ש׳", tie: "תיקו! אף אחד לא הודח.", eliminated: "הודח.", wasImp: "היה מתחזה: ",
    yes: "✓ כן", no: "✗ לא", impWas: "המתחזה היה: ", impWord: "המילה שלו: ", civWord: "המילה של התמימים: ",
    needName: "הכנס שם", needCode: "הכנס קוד", clue: "מילת רמז",
    cats: { sport: "ספורט", celebrite: "מפורסמים", film: "סרטים", anime: "אנימה", musique: "מוזיקה", nature: "טבע", nourriture: "אוכל", animaux: "חיות" }
  }
};

let lang = localStorage.getItem("lang") || "fr";
let host = null;
let state = null;
let myVote = null;
let timerInt = null;

function t(k) { return T[lang][k] || k; }

function setLang(l) {
  lang = l;
  localStorage.setItem("lang", l);
  document.documentElement.lang = l;
  document.body.dir = l === "he" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll("[data-p]").forEach(e => e.placeholder = t(e.dataset.p));
  ["fr", "en", "he"].forEach(x => document.getElementById("lang-" + x).classList.toggle("active", x === l));
  const sel = document.getElementById("category");
  const cur = sel.value || "sport";
  sel.innerHTML = "";
  Object.keys(T[l].cats).forEach(k => {
    const o = document.createElement("option");
    o.value = k; o.textContent = T[l].cats[k];
    sel.appendChild(o);
  });
  sel.value = cur;
  if (state) renderGame(state);
}

function show(id) {
  ["home", "lobby", "clues", "voting", "end"].forEach(x => document.getElementById(x).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

function showError(msg) {
  const e = document.getElementById("error");
  e.textContent = msg;
  setTimeout(() => { e.textContent = ""; }, 3000);
}

function createRoom() {
  const name = document.getElementById("name").value.trim();
  if (!name) return showError(t("needName"));
  socket.emit("createRoom", { name });
}

function joinRoom() {
  const name = document.getElementById("name").value.trim();
  const code = document.getElementById("codeInput").value.trim().toUpperCase();
  if (!name) return showError(t("needName"));
  if (!code) return showError(t("needCode"));
  socket.emit("joinRoom", { name, code });
}

function setCategory() { socket.emit("setCategory", document.getElementById("category").value); }
function startGame() { socket.emit("startGame"); }
function again() { socket.emit("again"); }

function leave() {
  socket.emit("leave");
  if (timerInt) clearInterval(timerInt);
  show("home");
}

function sendClue() {
  const input = document.getElementById("clueInput");
  const v = input.value.trim();
  if (!v) return;
  socket.emit("clue", v);
  input.value = "";
}

document.getElementById("clueInput").addEventListener("keydown", e => { if (e.key === "Enter") sendClue(); });

function vote(id) {
  myVote = id;
  socket.emit("vote", id);
  updateVoteButtons();
}

function updateVoteButtons() {
  document.querySelectorAll(".vote-btn").forEach(b => {
    b.classList.toggle("voted", b.dataset.playerId === myVote);
  });
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function cluesHtml(clues) {
  return clues.map(c => '<div class="clue"><b>' + esc(c.name) + '</b> : ' + esc(c.clue) + '</div>').join("");
}

function renderGame(d) {
  if (d.phase === "clues") {
    show("clues");
    document.getElementById("myWord").textContent = d.word;
    const myTurn = d.turn === socket.id;
    const current = d.players.find(p => p.id === d.turn);
    document.getElementById("turnInfo").textContent = myTurn
      ? t("yourTurn")
      : t("turnOf") + (current ? current.name : "") + "  (" + t("round") + " " + d.round + "/2)";
    document.getElementById("clueBox").classList.toggle("hidden", !myTurn);
    document.getElementById("cluesList").innerHTML = cluesHtml(d.clues);
  }
  if (d.phase === "voting") {
    show("voting");
    document.getElementById("voteButtons").innerHTML = d.players
      .filter(p => p.id !== socket.id)
      .map(p => '<button class="vote-btn" data-player-id="' + p.id + '" onclick="vote(\'' + p.id + '\')">' + esc(p.name) + '</button>')
      .join("");
    document.getElementById("cluesList2").innerHTML = cluesHtml(d.clues);
    updateVoteButtons();
    startTimer();
  }
}

let timerStarted = false;
function startTimer() {
  if (timerStarted) return;
  timerStarted = true;
  let left = 15;
  const el = document.getElementById("timer");
  el.textContent = left + t("secs");
  if (timerInt) clearInterval(timerInt);
  timerInt = setInterval(() => {
    left--;
    el.textContent = Math.max(left, 0) + t("secs");
    if (left <= 0) clearInterval(timerInt);
  }, 1000);
}

socket.on("roomUpdate", (d) => {
  host = d.host;
  show("lobby");
  document.getElementById("roomCode").textContent = d.code;
  document.getElementById("playersList").innerHTML = d.players
    .map(p => "<li>" + (p.id === d.host ? "👑 " : "👤 ") + esc(p.name) + "</li>").join("");
  const isHost = d.host === socket.id;
  document.getElementById("startBtn").classList.toggle("hidden", !isHost);
  document.getElementById("catBox").classList.toggle("hidden", !isHost);
  document.getElementById("waitHost").classList.toggle("hidden", isHost);
  document.getElementById("category").value = d.selectedCategory;
});

socket.on("gameUpdate", (d) => {
  if (d.phase === "clues") { timerStarted = false; myVote = null; }
  state = d;
  renderGame(d);
});

socket.on("gameEnd", (r) => {
  if (timerInt) clearInterval(timerInt);
  timerStarted = false;
  show("end");
  let html;
  if (r.tie) {
    html = "<p>" + t("tie") + "</p>";
  } else {
    html = "<p><b>" + esc(r.eliminatedName) + "</b> " + t("eliminated") + "</p>" +
           "<p>" + t("wasImp") + (r.wasImpostor ? t("yes") : t("no")) + "</p>";
  }
  html += "<p>" + t("impWas") + "<b>" + esc(r.impostorName) + "</b></p>" +
          "<p>" + t("impWord") + "<b>" + esc(r.impostorWord) + "</b></p>" +
          "<p>" + t("civWord") + "<b>" + esc(r.civilWord) + "</b></p>";
  document.getElementById("result").innerHTML = html;
  const isHost = host === socket.id;
  document.getElementById("againBtn").classList.toggle("hidden", !isHost);
  document.getElementById("waitHost2").classList.toggle("hidden", isHost);
});

socket.on("backToLobby", () => { if (timerInt) clearInterval(timerInt); timerStarted = false; });
socket.on("errorMsg", (m) => showError(m));

setLang(lang);
show("home");
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imposteur</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at top, #2b1055 0%, #12082b 55%, #0a0618 100%);
    background-attachment: fixed;
    color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh;
  }
  .app { width: 100%; max-width: 480px; }
  h1 { text-align: center; font-weight: 900; letter-spacing: 1px; text-shadow: 0 4px 20px rgba(168,85,247,.6); }
  .card {
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(8px); border-radius: 20px; padding: 20px; margin-bottom: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); animation: pop .35s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
  input, select {
    width: 100%; padding: 14px; margin: 6px 0; border-radius: 14px; border: 2px solid transparent;
    background: rgba(255,255,255,.95); color: #222; font-size: 16px; outline: none;
  }
  input:focus, select:focus { border-color: #a855f7; }
  button {
    width: 100%; padding: 14px; margin: 6px 0; border: none; border-radius: 16px;
    background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; font-size: 17px; font-weight: 700;
    cursor: pointer; transition: transform .15s, box-shadow .15s; box-shadow: 0 5px 0 #0f7a38;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #0f7a38; }
  button.secondary { background: linear-gradient(135deg, #8b5cf6, #6d28d9); box-shadow: 0 5px 0 #4c1d95; }
  button.danger { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 5px 0 #7f1d1d; }
  button.settings { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 5px 0 #92400e; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .vote-btn { background: linear-gradient(135deg, #475569, #334155); box-shadow: 0 5px 0 #1e293b; }
  .vote-btn.voted { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #000; box-shadow: 0 5px 0 #92400e; }
  .lang { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
  .lang button { width: auto; padding: 6px 14px; font-size: 14px; background: #3b3560; box-shadow: none; }
  .lang button.active { background: #a855f7; }
  .hidden { display: none !important; }
  .clue { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
  .players li { padding: 6px 0; list-style: none; font-size: 18px; }
  .players { padding: 0; }
  .timer { text-align: center; font-size: 28px; font-weight: 800; color: #fbbf24; margin: 8px 0; }
  .error { color: #ff7b7b; text-align: center; min-height: 20px; }
  .code { text-align: center; font-size: 38px; letter-spacing: 8px; font-weight: 900; color: #fbbf24; text-shadow: 0 0 18px rgba(251,191,36,.5); }

  /* Réglages */
  .settings-panel { background: rgba(0,0,0,.25); border-radius: 14px; padding: 12px; margin: 8px 0; }
  .switch-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; }
  .switch { position: relative; width: 56px; height: 30px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #475569; border-radius: 30px; cursor: pointer; transition: .25s; }
  .slider:before { content: ""; position: absolute; width: 22px; height: 22px; left: 4px; top: 4px; background: #fff; border-radius: 50%; transition: .25s; }
  .switch input:checked + .slider { background: #22c55e; }
  .switch input:checked + .slider:before { transform: translateX(26px); }
  .setting-state { text-align: center; opacity: .8; font-size: 14px; }

  /* Carte 3D */
  .scene { perspective: 1000px; width: 220px; height: 300px; margin: 15px auto; }
  .flip-card {
    position: relative; width: 100%; height: 100%; cursor: pointer;
    transform-style: preserve-3d; transition: transform .8s cubic-bezier(.4, .2, .2, 1);
    animation: floaty 3s ease-in-out infinite;
  }
  .flip-card.flipped { transform: rotateY(180deg); animation: none; }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotateY(0); } 50% { transform: translateY(-8px) rotateY(0); } }
  .face {
    position: absolute; inset: 0; border-radius: 20px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px;
    box-shadow: 0 15px 40px rgba(0,0,0,.5);
  }
  .face.back {
    background: repeating-linear-gradient(45deg, #4c1d95, #4c1d95 12px, #5b21b6 12px, #5b21b6 24px);
    border: 4px solid #a855f7; box-shadow: 0 0 30px rgba(168,85,247,.6), 0 15px 40px rgba(0,0,0,.5);
  }
  .face.back span { font-size: 70px; opacity: .6; }
  .face.front { background: linear-gradient(160deg, #1e1b4b, #312e81); border: 4px solid #fbbf24; transform: rotateY(180deg); }
  .face.front .w { font-size: 30px; font-weight: 900; word-break: break-word; }
  .face.front .r { margin-top: 14px; font-size: 22px; font-weight: 900; padding: 6px 14px; border-radius: 12px; }
  .r.innocent { background: #16a34a; }
  .r.impostor { background: #dc2626; }
  .tap-hint { text-align: center; opacity: .7; font-size: 14px; }
</style>
</head>
<body>
<div class="app">
  <div class="lang">
    <button id="lang-fr" onclick="setLang('fr')">FR</button>
    <button id="lang-en" onclick="setLang('en')">EN</button>
    <button id="lang-he" onclick="setLang('he')">עב</button>
  </div>

  <h1>🕵️ <span data-t="title"></span></h1>
  <div class="error" id="error"></div>

  <!-- ACCUEIL -->
  <div id="home" class="card">
    <input id="name" maxlength="16" data-p="yourName">
    <button onclick="createRoom()" data-t="create"></button>
    <input id="codeInput" maxlength="4" data-p="code" style="text-transform:uppercase">
    <button class="secondary" onclick="joinRoom()" data-t="join"></button>
  </div>

  <!-- LOBBY -->
  <div id="lobby" class="card hidden">
    <div class="code" id="roomCode"></div>
    <p data-t="players"></p>
    <ul class="players" id="playersList"></ul>

    <div id="catBox">
      <p data-t="category"></p>
      <select id="category" onchange="setCategory()"></select>
      <button class="settings" onclick="toggleSettings()">⚙️ <span data-t="settings"></span></button>
      <div id="settingsPanel" class="settings-panel hidden">
        <div class="switch-row">
          <span data-t="showRole"></span>
          <label class="switch">
            <input type="checkbox" id="showRoleToggle" onchange="setSetting()">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <p id="settingState" class="setting-state hidden"></p>
    <button id="startBtn" onclick="startGame()" data-t="start"></button>
    <p id="waitHost" class="hidden" data-t="waitHost"></p>
    <button class="danger" onclick="leave()" data-t="leave"></button>
  </div>

  <!-- INDICES -->
  <div id="clues" class="card hidden">
    <div class="scene">
      <div class="flip-card" id="flipCard" onclick="flipCard()">
        <div class="face back"><span>❓</span></div>
        <div class="face front">
          <div class="w" id="myWord"></div>
          <div class="r hidden" id="myRole"></div>
        </div>
      </div>
    </div>
    <p class="tap-hint" data-t="tapCard"></p>
    <p id="turnInfo"></p>
    <div id="clueBox">
      <input id="clueInput" maxlength="24" data-p="clue">
      <button onclick="sendClue()" data-t="send"></button>
    </div>
    <div id="cluesList"></div>
  </div>

  <!-- VOTE -->
  <div id="voting" class="card hidden">
    <p data-t="voteTitle"></p>
    <div class="timer" id="timer"></div>
    <div id="voteButtons"></div>
    <div id="cluesList2"></div>
  </div>

  <!-- FIN -->
  <div id="end" class="card hidden">
    <div id="result"></div>
    <button id="againBtn" onclick="again()" data-t="again"></button>
    <p id="waitHost2" class="hidden" data-t="waitHost"></p>
    <button class="danger" onclick="leave()" data-t="leave"></button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const T = {
  fr: {
    title: "Imposteur", create: "Créer une partie", join: "Rejoindre", yourName: "Ton prénom", code: "Code de la partie",
    players: "Joueurs :", category: "Catégorie :", start: "Lancer la partie", waitHost: "En attente de l'hôte...",
    leave: "Quitter le groupe", send: "Envoyer", voteTitle: "Qui est l'imposteur ?",
    again: "Rejouer (rester dans le groupe)", yourTurn: "👉 C'est ton tour !", turnOf: "Tour de : ", round: "Tour",
    secs: "s", tie: "Égalité ! Personne n'est éliminé.", eliminated: "a été éliminé.", wasImp: "Était imposteur : ",
    yes: "✓ OUI", no: "✗ NON", impWas: "L'imposteur était : ", impWord: "Son mot : ", civWord: "Mot des innocents : ",
    needName: "Entre ton prénom", needCode: "Entre le code", clue: "Ton mot-indice",
    settings: "Réglages", showRole: "Afficher le rôle sur la carte", tapCard: "👆 Touche la carte pour la retourner",
    roleOn: "Rôle affiché sur la carte : OUI", roleOff: "Rôle affiché sur la carte : NON",
    innocent: "INNOCENT", impostor: "IMPOSTEUR",
    cats: { sport: "Sport", celebrite: "Célébrités", film: "Films", anime: "Anime", musique: "Musique", nature: "Nature", nourriture: "Nourriture", animaux: "Animaux" }
  },
  en: {
    title: "Impostor", create: "Create a game", join: "Join", yourName: "Your name", code: "Game code",
    players: "Players:", category: "Category:", start: "Start game", waitHost: "Waiting for the host...",
    leave: "Leave group", send: "Send", voteTitle: "Who is the impostor?",
    again: "Play again (stay in group)", yourTurn: "👉 It's your turn!", turnOf: "Turn of: ", round: "Round",
    secs: "s", tie: "Tie! Nobody is eliminated.", eliminated: "was eliminated.", wasImp: "Was impostor: ",
    yes: "✓ YES", no: "✗ NO", impWas: "The impostor was: ", impWord: "Their word: ", civWord: "Innocents' word: ",
    needName: "Enter your name", needCode: "Enter the code", clue: "Your clue word",
    settings: "Settings", showRole: "Show role on the card", tapCard: "👆 Tap the card to flip it",
    roleOn: "Role shown on card: YES", roleOff: "Role shown on card: NO",
    innocent: "INNOCENT", impostor: "IMPOSTOR",
    cats: { sport: "Sports", celebrite: "Celebrities", film: "Movies", anime: "Anime", musique: "Music", nature: "Nature", nourriture: "Food", animaux: "Animals" }
  },
  he: {
    title: "מתחזה", create: "צור משחק", join: "הצטרף", yourName: "השם שלך", code: "קוד משחק",
    players: "שחקנים:", category: "קטגוריה:", start: "התחל משחק", waitHost: "ממתין למארח...",
    leave: "עזוב קבוצה", send: "שלח", voteTitle: "מי המתחזה?",
    again: "שחק שוב (הישאר בקבוצה)", yourTurn: "👉 התור שלך!", turnOf: "התור של: ", round: "סיבוב",
    secs: "ש׳", tie: "תיקו! אף אחד לא הודח.", eliminated: "הודח.", wasImp: "היה מתחזה: ",
    yes: "✓ כן", no: "✗ לא", impWas: "המתחזה היה: ", impWord: "המילה שלו: ", civWord: "המילה של התמימים: ",
    needName: "הכנס שם", needCode: "הכנס קוד", clue: "מילת רמז",
    settings: "הגדרות", showRole: "הצג תפקיד על הקלף", tapCard: "👆 לחץ על הקלף כדי להפוך אותו",
    roleOn: "תפקיד מוצג על הקלף: כן", roleOff: "תפקיד מוצג על הקלף: לא",
    innocent: "תמים", impostor: "מתחזה",
    cats: { sport: "ספורט", celebrite: "מפורסמים", film: "סרטים", anime: "אנימה", musique: "מוזיקה", nature: "טבע", nourriture: "אוכל", animaux: "חיות" }
  }
};

let lang = localStorage.getItem("lang") || "fr";
let host = null;
let state = null;
let myVote = null;
let timerInt = null;
let showRole = false;
let lastRoundKey = null;

function t(k) { return T[lang][k] || k; }

function setLang(l) {
  lang = l;
  localStorage.setItem("lang", l);
  document.documentElement.lang = l;
  document.body.dir = l === "he" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll("[data-p]").forEach(e => e.placeholder = t(e.dataset.p));
  ["fr", "en", "he"].forEach(x => document.getElementById("lang-" + x).classList.toggle("active", x === l));
  const sel = document.getElementById("category");
  const cur = sel.value || "sport";
  sel.innerHTML = "";
  Object.keys(T[l].cats).forEach(k => {
    const o = document.createElement("option");
    o.value = k; o.textContent = T[l].cats[k];
    sel.appendChild(o);
  });
  sel.value = cur;
  updateSettingState();
  if (state) renderGame(state);
}

function show(id) {
  ["home", "lobby", "clues", "voting", "end"].forEach(x => document.getElementById(x).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

function showError(msg) {
  const e = document.getElementById("error");
  e.textContent = msg;
  setTimeout(() => { e.textContent = ""; }, 3000);
}

function createRoom() {
  const name = document.getElementById("name").value.trim();
  if (!name) return showError(t("needName"));
  socket.emit("createRoom", { name });
}

function joinRoom() {
  const name = document.getElementById("name").value.trim();
  const code = document.getElementById("codeInput").value.trim().toUpperCase();
  if (!name) return showError(t("needName"));
  if (!code) return showError(t("needCode"));
  socket.emit("joinRoom", { name, code });
}

function setCategory() { socket.emit("setCategory", document.getElementById("category").value); }
function startGame() { socket.emit("startGame"); }
function again() { socket.emit("again"); }

function toggleSettings() {
  document.getElementById("settingsPanel").classList.toggle("hidden");
}
function setSetting() {
  socket.emit("setSettings", { showRole: document.getElementById("showRoleToggle").checked });
}
function updateSettingState() {
  const el = document.getElementById("settingState");
  el.textContent = showRole ? t("roleOn") : t("roleOff");
}

function flipCard() {
  document.getElementById("flipCard").classList.toggle("flipped");
}

function leave() {
  socket.emit("leave");
  if (timerInt) clearInterval(timerInt);
  show("home");
}

function sendClue() {
  const input = document.getElementById("clueInput");
  const v = input.value.trim();
  if (!v) return;
  socket.emit("clue", v);
  input.value = "";
}

document.getElementById("clueInput").addEventListener("keydown", e => { if (e.key === "Enter") sendClue(); });

function vote(id) {
  myVote = id;
  socket.emit("vote", id);
  updateVoteButtons();
}

function updateVoteButtons() {
  document.querySelectorAll(".vote-btn").forEach(b => {
    b.classList.toggle("voted", b.dataset.playerId === myVote);
  });
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function cluesHtml(clues) {
  return clues.map(c => '<div class="clue"><b>' + esc(c.name) + '</b> : ' + esc(c.clue) + '</div>').join("");
}

function renderGame(d) {
  if (d.phase === "clues") {
    show("clues");

    // Carte : on la recache seulement au début d'une nouvelle manche
    const key = d.word + "|" + d.role;
    if (key !== lastRoundKey && d.clues.length === 0) {
      document.getElementById("flipCard").classList.remove("flipped");
      lastRoundKey = key;
    }
    document.getElementById("myWord").textContent = d.word;
    const roleEl = document.getElementById("myRole");
    if (showRole && d.role) {
      roleEl.textContent = d.role === "impostor" ? t("impostor") : t("innocent");
      roleEl.className = "r " + (d.role === "impostor" ? "impostor" : "innocent");
    } else {
      roleEl.className = "r hidden";
    }

    const myTurn = d.turn === socket.id;
    const current = d.players.find(p => p.id === d.turn);
    document.getElementById("turnInfo").textContent = myTurn
      ? t("yourTurn")
      : t("turnOf") + (current ? current.name : "") + "  (" + t("round") + " " + d.round + "/2)";
    document.getElementById("clueBox").classList.toggle("hidden", !myTurn);
    document.getElementById("cluesList").innerHTML = cluesHtml(d.clues);
  }
  if (d.phase === "voting") {
    show("voting");
    document.getElementById("voteButtons").innerHTML = d.players
      .filter(p => p.id !== socket.id)
      .map(p => '<button class="vote-btn" data-player-id="' + p.id + '" onclick="vote(\'' + p.id + '\')">' + esc(p.name) + '</button>')
      .join("");
    document.getElementById("cluesList2").innerHTML = cluesHtml(d.clues);
    updateVoteButtons();
    startTimer();
  }
}

let timerStarted = false;
function startTimer() {
  if (timerStarted) return;
  timerStarted = true;
  let left = 15;
  const el = document.getElementById("timer");
  el.textContent = left + t("secs");
  if (timerInt) clearInterval(timerInt);
  timerInt = setInterval(() => {
    left--;
    el.textContent = Math.max(left, 0) + t("secs");
    if (left <= 0) clearInterval(timerInt);
  }, 1000);
}

socket.on("roomUpdate", (d) => {
  host = d.host;
  showRole = !!(d.settings && d.settings.showRole);
  show("lobby");
  document.getElementById("roomCode").textContent = d.code;
  document.getElementById("playersList").innerHTML = d.players
    .map(p => "<li>" + (p.id === d.host ? "👑 " : "👤 ") + esc(p.name) + "</li>").join("");
  const isHost = d.host === socket.id;
  document.getElementById("startBtn").classList.toggle("hidden", !isHost);
  document.getElementById("catBox").classList.toggle("hidden", !isHost);
  document.getElementById("waitHost").classList.toggle("hidden", isHost);
  document.getElementById("category").value = d.selectedCategory;
  document.getElementById("showRoleToggle").checked = showRole;
  const st = document.getElementById("settingState");
  st.classList.toggle("hidden", isHost);
  updateSettingState();
});

socket.on("gameUpdate", (d) => {
  if (d.phase === "clues") { timerStarted = false; myVote = null; }
  state = d;
  renderGame(d);
});

socket.on("gameEnd", (r) => {
  if (timerInt) clearInterval(timerInt);
  timerStarted = false;
  lastRoundKey = null;
  show("end");
  let html;
  if (r.tie) {
    html = "<p>" + t("tie") + "</p>";
  } else {
    html = "<p><b>" + esc(r.eliminatedName) + "</b> " + t("eliminated") + "</p>" +
           "<p>" + t("wasImp") + (r.wasImpostor ? t("yes") : t("no")) + "</p>";
  }
  html += "<p>" + t("impWas") + "<b>" + esc(r.impostorName) + "</b></p>" +
          "<p>" + t("impWord") + "<b>" + esc(r.impostorWord) + "</b></p>" +
          "<p>" + t("civWord") + "<b>" + esc(r.civilWord) + "</b></p>";
  document.getElementById("result").innerHTML = html;
  const isHost = host === socket.id;
  document.getElementById("againBtn").classList.toggle("hidden", !isHost);
  document.getElementById("waitHost2").classList.toggle("hidden", isHost);
});

socket.on("backToLobby", () => { if (timerInt) clearInterval(timerInt); timerStarted = false; });
socket.on("errorMsg", (m) => showError(m));

setLang(lang);
show("home");
</script>
</body>
</html>
